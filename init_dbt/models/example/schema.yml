
version: 2

models:
  - name: my_first_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: my_second_dbt_model
    description: "A starter dbt model"
    columns:
      - name: id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null

  - name: stg_users
    description: "Staging de users a partir do seed"
    columns:
      - name: id
        description: "Chave primaria"
        data_tests:
          - unique
          - not_null

  - name: users_by_country
    description: "Agregado de usuarios por pais"
    columns:
      - name: country
        description: "Pais"
        data_tests:
          - not_null
      - name: n_users
        description: "Total de usuarios"

  - name: stg_orders
    description: "Staging de orders a partir do seed"
    columns:
      - name: order_id
        description: "Chave primaria do pedido"
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: "FK para stg_users"
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: id

  - name: orders_by_user
    description: "LTV e n de pedidos por usuario"
    columns:
      - name: user_id
        description: "Chave primaria"
        data_tests:
          - unique
          - not_null

  - name: users_by_month
    description: "Agregado de usuarios por mes de cadastro"
    columns:
      - name: month
        description: "Primeiro dia do mes"
        data_tests:
          - unique
          - not_null
      - name: n_users
        description: "Total de usuarios"
